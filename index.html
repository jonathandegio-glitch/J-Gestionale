<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionale Spese e Entrate</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">Gestionale Finanziario</h1>
    <div id="auth-status" class="text-sm">
      <span id="user-email" class="mr-3"></span>
      <button id="logout-btn" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1 rounded hidden">Logout</button>
    </div>
  </header>

  <!-- Login Form -->
  <div id="auth-container" class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-xl font-bold mb-4 text-center">Accedi al Gestionale</h2>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium">Email</label>
        <input type="email" id="login-email" class="w-full border p-2 rounded mt-1" required>
      </div>
      <div>
        <label class="block text-sm font-medium">Password</label>
        <input type="password" id="login-password" class="w-full border p-2 rounded mt-1" required>
      </div>
      <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded font-semibold hover:bg-indigo-700">Accedi</button>
    </form>
  </div>

  <!-- App Main Interface -->
  <main id="app-container" class="max-w-4xl mx-auto mt-6 p-4 hidden space-y-6">

    <!-- Form Inserimento Rapido -->
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-lg font-bold mb-4">Nuovo Movimento</h2>
      <form id="quick-expense-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-sm font-medium">Data</label>
          <input type="date" id="quick-date" class="w-full border p-2 rounded mt-1" required>
        </div>
        <div>
          <label class="block text-sm font-medium">Importo (€)</label>
          <input type="number" step="0.01" id="quick-amount" class="w-full border p-2 rounded mt-1" placeholder="0.00" required>
        </div>
        <div>
          <label class="block text-sm font-medium">Descrizione</label>
          <input type="text" id="quick-desc" class="w-full border p-2 rounded mt-1" placeholder="Es. Spesa alimentari" required>
        </div>
        <div class="flex items-end">
          <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded font-semibold hover:bg-emerald-700">Aggiungi</button>
        </div>
      </form>
    </div>

    <!-- Lista Movimenti -->
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-lg font-bold mb-4">Movimenti Sincronizzati</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b bg-slate-50 text-slate-600 text-sm">
              <th class="p-3">Data</th>
              <th class="p-3">Descrizione</th>
              <th class="p-3">Importo</th>
            </tr>
          </thead>
          <tbody id="movements-list">
            <tr>
              <td colspan="3" class="p-4 text-center text-slate-400">Nessun movimento presente.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Firebase Script Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    // Configurazione Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBF1S3NeA-IKxqna87CEzRiMGGN3AOnONo",
      authDomain: "gestionale-spese-e-entrate.firebaseapp.com",
      databaseURL: "https://gestionale-spese-e-entrate-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "gestionale-spese-e-entrate",
      storageBucket: "gestionale-spese-e-entrate.firebasestorage.app",
      messagingSenderId: "129010726048",
      appId: "1:129010726048:web:ebabd5819b52743ff505c5"
    };

    // Inizializzazione
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Riferimenti DOM
    const authContainer = document.getElementById('auth-container');
    const appContainer = document.getElementById('app-container');
    const userEmailSpan = document.getElementById('user-email');
    const logoutBtn = document.getElementById('logout-btn');
    const movementsList = document.getElementById('movements-list');

    // Gestione Stato Autenticazione
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authContainer.classList.add('hidden');
        appContainer.classList.remove('hidden');
        userEmailSpan.textContent = user.email;
        logoutBtn.classList.remove('hidden');
        
        // Imposta la data odierna nel form
        document.getElementById('quick-date').value = new Date().toISOString().split('T')[0];
        
        // Ascolta i cambiamenti in tempo reale dal Realtime Database
        loadUserData(user.uid);
      } else {
        authContainer.classList.remove('hidden');
        appContainer.classList.add('hidden');
        userEmailSpan.textContent = '';
        logoutBtn.classList.add('hidden');
      }
    });

    // Login Form
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        alert("Errore d'accesso: " + error.message);
      }
    });

    // Logout
    logoutBtn.addEventListener('click', () => signOut(auth));

    // Salva Movimento su Firebase Realtime Database
    document.getElementById('quick-expense-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return alert("Devi essere autenticato!");

      const date = document.getElementById('quick-date').value;
      const amount = parseFloat(document.getElementById('quick-amount').value);
      const desc = document.getElementById('quick-desc').value;

      const newMovement = { date, amount, desc, createdAt: Date.now() };

      try {
        const userMovementsRef = ref(db, `users/${user.uid}/movements`);
        const newRef = push(userMovementsRef);
        await set(newRef, newMovement);

        document.getElementById('quick-amount').value = "";
        document.getElementById('quick-desc').value = "";
      } catch (error) {
        console.error("Errore nel salvataggio su Firebase:", error);
        alert("Impossibile salvare i dati: " + error.message);
      }
    });

    // Lettura Dati in Tempo Reale
    function loadUserData(uid) {
      const userMovementsRef = ref(db, `users/${uid}/movements`);
      onValue(userMovementsRef, (snapshot) => {
        const data = snapshot.val();
        movementsList.innerHTML = "";

        if (!data) {
          movementsList.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-slate-400">Nessun movimento presente.</td></tr>`;
          return;
        }

        Object.keys(data).reverse().forEach((key) => {
          const item = data[key];
          const tr = document.createElement('tr');
          tr.className = "border-b hover:bg-slate-50";
          tr.innerHTML = `
            <td class="p-3 text-sm">${item.date}</td>
            <td class="p-3 text-sm font-medium">${item.desc}</td>
            <td class="p-3 text-sm font-bold text-slate-700">€ ${parseFloat(item.amount).toFixed(2)}</td>
          `;
          movementsList.appendChild(tr);
        });
      }, (error) => {
        console.error("Errore nel recupero dati:", error);
      });
    }
  </script>
</body>
</html>
