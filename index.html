<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionale Spese & Entrate Cloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-inner: #0f172a;
      --accent-blue: #38bdf8;
      --accent-hover: #0284c7;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 30px;
    }

    #auth-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 30px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .app-logo-img {
      height: 100px;
      max-width: 100%;
      margin-bottom: 20px;
      object-fit: contain;
    }

    header.app-bar {
      height: 70px;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .app-bar .status-badge {
      font-size: 0.75rem;
      background: rgba(34, 197, 94, 0.15);
      color: var(--accent-green);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .app-bar .logo-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .app-bar .logo-container img {
      height: 60px;
      object-fit: contain;
    }

    .menu-btn {
      background: var(--border-color);
      color: var(--text-main);
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.open { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 360px;
      height: 100%;
      background: var(--card-bg);
      z-index: 201;
      box-shadow: -10px 0 25px rgba(0,0,0,0.5);
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      overflow-y: auto;
    }

    .drawer.open { right: 0; }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
    }

    .form-control:focus { border-color: var(--accent-blue); }

    .btn {
      width: 100%;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn-primary { background: var(--accent-blue); color: #000; }
    .btn-secondary { background: var(--border-color); color: var(--text-main); }
    .btn-danger { background: var(--accent-red); color: #fff; }

    main.container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px;
      width: 100%;
      flex: 1;
    }

    .view-section { display: none; }
    .view-section.active { display: block; }

    .quick-nav {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .nav-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      cursor: pointer;
    }

    .nav-card i { font-size: 1.5rem; color: var(--accent-blue); margin-bottom: 8px; }
    .nav-card div { font-size: 0.85rem; font-weight: 600; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--accent-blue);
      flex-wrap: wrap;
      gap: 10px;
    }

    .week-block {
      background: var(--card-inner);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .week-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      background: rgba(255,255,255,0.02);
    }

    .week-content {
      padding: 14px;
      border-top: 1px solid var(--border-color);
      display: none;
    }

    .week-block.open .week-content { display: block; }

    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.85rem;
    }

    .expense-item:last-child { border-bottom: none; }

    .edit-date-btn {
      background: none;
      border: none;
      color: var(--accent-blue);
      cursor: pointer;
      font-size: 0.8rem;
      margin-left: 8px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-card">
      <img src="https://lh3.googleusercontent.com/d/1eimNS4XHA7QeuNP2qnTRdC1COpFQGV3c" alt="Logo" class="app-logo-img">
      <h2 style="margin-bottom: 20px; font-weight:700;">Accedi al Gestionale</h2>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="es. nome@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-pass" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">
          <i class="fa-solid fa-right-to-bracket"></i> Accedi
        </button>
      </form>
      <div id="auth-error" style="color: var(--accent-red); margin-top: 10px; font-size: 0.85rem;"></div>
    </div>
  </div>

  <header class="app-bar">
    <span class="status-badge"><i class="fa-solid fa-circle" style="font-size:8px;"></i> ONLINE</span>
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1eimNS4XHA7QeuNP2qnTRdC1COpFQGV3c" alt="Logo">
    </div>
    <button class="menu-btn" id="open-drawer-btn">
      <i class="fa-solid fa-bars"></i> Menu
    </button>
  </header>

  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <h3 style="font-weight:700;">Menu Navigazione</h3>
      <button class="close-btn" id="close-drawer-btn">&times;</button>
    </div>

    <button class="btn btn-secondary nav-item-btn" data-target="sec-home">
      <i class="fa-solid fa-house"></i> Home / Inserimento Rapido
    </button>
    <button class="btn btn-secondary nav-item-btn" data-target="sec-mensile">
      <i class="fa-solid fa-calendar-days"></i> Gestione Mensile
    </button>

    <div style="margin-top: auto; padding-top: 20px;">
      <button class="btn btn-danger" id="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </div>

  <main class="container">

    <section id="sec-home" class="view-section active">
      <div class="card">
        <div class="card-title">
          <span><i class="fa-solid fa-bolt"></i> Inserimento Rapido Spesa</span>
        </div>
        <form id="quick-expense-form">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
              <label>Data</label>
              <input type="date" id="quick-date" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Importo (€)</label>
              <input type="number" step="0.01" id="quick-amount" class="form-control" placeholder="0.00" required>
            </div>
          </div>
          <div class="form-group">
            <label>Nome / Descrizione Spesa</label>
            <input type="text" id="quick-desc" class="form-control" placeholder="Es. Pranzo, Spesa, Caffe" required>
          </div>
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Salva Spesa
          </button>
        </form>
      </div>

      <div class="quick-nav">
        <div class="nav-card nav-item-btn" data-target="sec-mensile">
          <i class="fa-solid fa-calendar-days"></i><div>Mensile</div>
        </div>
      </div>
    </section>

    <section id="sec-mensile" class="view-section">
      <div class="card">
        <div class="card-title">
          <span><i class="fa-solid fa-calendar-days"></i> Gestione Mensile (Ciclo 15-15)</span>
          <select id="select-month-cycle" class="form-control" style="width: auto; padding: 6px 10px; font-weight:600;">
          </select>
        </div>

        <div id="weeks-container"></div>
      </div>
    </section>

  </main>

  <div class="modal" id="edit-week-modal">
    <div class="modal-content">
      <h3 style="margin-bottom:15px;" id="modal-week-title">Personalizza Settimana</h3>
      <div class="form-group">
        <label>Data Inizio</label>
        <input type="date" id="modal-start-date" class="form-control">
      </div>
      <div class="form-group">
        <label>Data Fine</label>
        <input type="date" id="modal-end-date" class="form-control">
      </div>
      <button class="btn btn-primary" id="save-week-dates-btn">Salva Date</button>
      <button class="btn btn-secondary" id="close-modal-btn">Annulla</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBF1S3NeA-IKxqna87CEzRiMGGN3AOnONo",
      authDomain: "gestionale-spese-e-entrate.firebaseapp.com",
      projectId: "gestionale-spese-e-entrate",
      storageBucket: "gestionale-spese-e-entrate.firebasestorage.app",
      messagingSenderId: "129010726048",
      appId: "1:129010726048:web:ebabd5819b52743ff505c5",
      measurementId: "G-26D9CJ55RW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const authScreen = document.getElementById('auth-screen');
    const loginForm = document.getElementById('login-form');
    const authError = document.getElementById('auth-error');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-pass').value);
      } catch (err) {
        authError.textContent = "Errore di accesso: " + err.message;
      }
    });

    onAuthStateChanged(auth, (user) => {
      authScreen.style.display = user ? 'none' : 'flex';
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    // Gestione Spese e Struttura Mesi
    let expenses = JSON.parse(localStorage.getItem('expenses_data')) || [];
    let customWeekRanges = JSON.parse(localStorage.getItem('custom_week_ranges')) || {};

    const months = [
      "Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno",
      "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"
    ];

    const monthSelect = document.getElementById('select-month-cycle');

    function initMonthDropdown() {
      monthSelect.innerHTML = "";
      const currentYear = 2026;
      
      months.forEach((mName, idx) => {
        // Regola 15-15: Agosto = 15/09 al 15/10 dello stesso anno
        let startM = idx + 1;
        let endM = idx + 2;
        let startY = currentYear;
        let endY = currentYear;

        if (startM > 11) {
          startM = startM % 12;
          if (idx === 11) { startM = 0; endM = 1; startY++; endY++; }
        }
        if (endM > 11) { endM = 0; endY++; }

        const startStr = `15/${String(startM + 1).padStart(2,'0')}`;
        const endStr = `15/${String(endM + 1).padStart(2,'0')}`;

        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${mName} (${startStr} - ${endStr})`;
        if (idx === 7) opt.selected = true; // Seleziona Agosto di default
        monthSelect.appendChild(opt);
      });
    }

    function getMonthDateRange(monthIndex, year = 2026) {
      let startMonth = monthIndex + 1;
      let endMonth = monthIndex + 2;
      let startYear = year;
      let endYear = year;

      if (startMonth > 11) { startMonth = 0; startYear++; }
      if (endMonth > 11) { endMonth = 0; endYear++; }

      const startDate = new Date(startYear, startMonth, 15);
      const endDate = new Date(endYear, endMonth, 15);
      return { startDate, endDate };
    }

    function generateWeeks(monthIndex) {
      const key = `month_${monthIndex}`;
      if (customWeekRanges[key]) return customWeekRanges[key];

      const { startDate, endDate } = getMonthDateRange(monthIndex);
      const weeks = [];
      let currStart = new Date(startDate);
      let weekNum = 1;

      while (currStart < endDate) {
        let currEnd = new Date(currStart);
        let dayOfWeek = currEnd.getDay(); 
        let distToSun = dayOfWeek === 0 ? 0 : 7 - dayOfWeek;
        currEnd.setDate(currEnd.getDate() + distToSun);

        if (currEnd > endDate) currEnd = new Date(endDate);

        weeks.push({
          id: weekNum,
          start: currStart.toISOString().split('T')[0],
          end: currEnd.toISOString().split('T')[0]
        });

        currStart = new Date(currEnd);
        currStart.setDate(currStart.getDate() + 1);
        weekNum++;
      }
      return weeks;
    }

    function renderMonthlyView() {
      const monthIdx = parseInt(monthSelect.value);
      const container = document.getElementById('weeks-container');
      container.innerHTML = "";

      const weeks = generateWeeks(monthIdx);

      weeks.forEach((w, i) => {
        const wExpenses = expenses.filter(e => e.date >= w.start && e.date <= w.end);
        const wTotal = wExpenses.reduce((acc, curr) => acc + parseFloat(curr.amount), 0);

        const formatD = (dStr) => {
          const parts = dStr.split('-');
          return `${parts[2]}/${parts[1]}`;
        };

        const weekEl = document.createElement('div');
        weekEl.className = `week-block ${i === 0 ? 'open' : ''}`;
        weekEl.innerHTML = `
          <div class="week-header">
            <span>Settimana ${i + 1} (${formatD(w.start)} - ${formatD(w.end)}) 
              <button class="edit-date-btn" data-m="${monthIdx}" data-w="${i}"><i class="fa-solid fa-pen"></i></button>
            </span>
            <span style="color:var(--accent-red);">- € ${wTotal.toFixed(2)}</span>
          </div>
          <div class="week-content">
            ${wExpenses.length === 0 ? '<i>Nessuna spesa inserita per questa settimana</i>' : 
              wExpenses.map(e => `
                <div class="expense-item">
                  <span><b>${e.desc}</b> (${formatD(e.date)})</span>
                  <span style="color:var(--accent-red);">- € ${parseFloat(e.amount).toFixed(2)}</span>
                </div>
              `).join('')}
          </div>
        `;

        weekEl.querySelector('.week-header').addEventListener('click', (e) => {
          if (e.target.closest('.edit-date-btn')) return;
          weekEl.classList.toggle('open');
        });

        container.appendChild(weekEl);
      });

      document.querySelectorAll('.edit-date-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const m = btn.dataset.m;
          const w = btn.dataset.w;
          openEditWeekModal(m, w);
        });
      });
    }

    // Gestione Modale Personalizzazione Date
    let activeEdit = null;
    function openEditWeekModal(mIdx, wIdx) {
      activeEdit = { mIdx, wIdx };
      const weeks = generateWeeks(parseInt(mIdx));
      const currentW = weeks[wIdx];

      document.getElementById('modal-week-title').textContent = `Modifica Settimana ${parseInt(wIdx) + 1}`;
      document.getElementById('modal-start-date').value = currentW.start;
      document.getElementById('modal-end-date').value = currentW.end;
      document.getElementById('edit-week-modal').classList.add('open');
    }

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      document.getElementById('edit-week-modal').classList.remove('open');
    });

    document.getElementById('save-week-dates-btn').addEventListener('click', () => {
      if (!activeEdit) return;
      const { mIdx, wIdx } = activeEdit;
      const key = `month_${mIdx}`;
      let weeks = generateWeeks(parseInt(mIdx));

      weeks[wIdx].start = document.getElementById('modal-start-date').value;
      weeks[wIdx].end = document.getElementById('modal-end-date').value;

      customWeekRanges[key] = weeks;
      localStorage.setItem('custom_week_ranges', JSON.stringify(customWeekRanges));

      document.getElementById('edit-week-modal').classList.remove('open');
      renderMonthlyView();
    });

    // Inserimento Spesa Rapida
    document.getElementById('quick-expense-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const date = document.getElementById('quick-date').value;
      const amount = parseFloat(document.getElementById('quick-amount').value);
      const desc = document.getElementById('quick-desc').value;

      expenses.push({ id: Date.now(), date, amount, desc });
      localStorage.setItem('expenses_data', JSON.stringify(expenses));

      document.getElementById('quick-amount').value = "";
      document.getElementById('quick-desc').value = "";
      
      alert("Spesa salvata con successo!");
      renderMonthlyView();
    });

    // Drawer e Navigation
    const drawer = document.getElementById('drawer');
    const drawerOverlay = document.getElementById('drawer-overlay');

    document.getElementById('open-drawer-btn').addEventListener('click', () => {
      drawer.classList.add('open');
      drawerOverlay.classList.add('open');
    });

    function closeDrawer() {
      drawer.classList.remove('open');
      drawerOverlay.classList.remove('open');
    }

    document.getElementById('close-drawer-btn').addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', closeDrawer);

    document.querySelectorAll('.nav-item-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.target;
        document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
        document.getElementById(target).classList.add('active');
        closeDrawer();
      });
    });

    monthSelect.addEventListener('change', renderMonthlyView);

    // Inizializzazione
    document.getElementById('quick-date').valueAsDate = new Date();
    initMonthDropdown();
    renderMonthlyView();
  </script>
</body>
</html>
